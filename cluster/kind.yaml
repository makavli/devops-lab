# kind cluster "lab": 1 control plane + 2 workers. Each node is a Docker container running systemd,
# containerd and kubelet; kubeadm bootstraps it like real machines (etcd, apiserver... as static pods).
# Recreate from scratch: ./lab down && ./lab up        Handbook: docs/handbook/02-cluster.md
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    # Node image pinned by tag and digest: kind v0.33.0's default (Kubernetes v1.37.0). Bump it with kind.
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"   # the Envoy proxy is pinned to this node (platform/envoy-gateway)
    # Only this node publishes a port, on 127.0.0.1 only (never the LAN: the UIs are plain HTTP and Prometheus
    # has no login), and WSL forwards its localhost to Windows:
    # browser -> localhost:80 -> this container :80 -> Envoy hostPort 80 -> pods.
    extraPortMappings:
      - { containerPort: 80, hostPort: 80, listenAddress: "127.0.0.1", protocol: TCP }
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  - role: worker
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
