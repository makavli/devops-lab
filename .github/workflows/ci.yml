# CI: the same gate as local `./lab check`, on our own WSL runner (./lab runner) so it costs no
# GitHub-hosted minutes. Never point a self-hosted runner at a public repo: any fork's PR could run code on it.
name: ci
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: [self-hosted, linux, devops-lab]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: ./lab check
