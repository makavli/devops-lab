name: check

# `./lab check` (shell lint, workflow rules, every manifest against its schema) for every pull request and on main,
# on GitHub's own runners: free for a public repo, and fresh for every run. `passed` is the one check main's ruleset
# requires. The token can only read, except in `issue`, which opens an issue while the checks of a pull request or of
# main are red and closes it once they are green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push cancels its older run; each commit on main keeps its own run.
concurrency:
  group: check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck is on the runner (./lab check would skip it otherwise)
        run: shellcheck --version
      - name: ./lab check
        run: ./lab check

  # One name for the rule on main to require, whatever jobs are added later.
  passed:
    if: always()
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every check job succeeded
        run: test "${{ needs.check.result }}" = "success"

  # Red checks open an issue: one per pull request, linked to it, and one for main. The next green run closes it, and
  # so does closing the pull request (close-issue.yml). What stops the merge is `passed`; the issue is the notice.
  # A fork's token cannot write issues: forks are left out.
  issue:
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    needs: passed
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read # to ask which commit is main's head
      issues: write
      pull-requests: write
    steps:
      - name: Open, update or close the issue of this pull request or of main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RESULT: ${{ needs.passed.result }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR" ]; then title="Checks failed on pull request #$PR"; else title="Checks failed on main"; fi
          issue="$(gh api "repos/$GH_REPO/issues?state=open&labels=ci-failure&per_page=100" --jq ".[] | select(.pull_request == null and .title == \"$title\") | .number" | head -n 1)"
          if [ "$RESULT" = "success" ]; then
            [ -n "$issue" ] || exit 0
            # On main only the head's run may close it: an older commit can turn green after a newer one went red.
            if [ -z "$PR" ] && [ "$(gh api "repos/$GH_REPO/commits/main" --jq .sha)" != "$SHA" ]; then exit 0; fi
            gh issue close "$issue" --comment "Fixed: the checks on ${SHA:0:7} are green. $RUN"
            exit 0
          fi
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "Still red on ${SHA:0:7}: $RUN"
            exit 0
          fi
          # A pull request closed while this run went on gets no issue: close-issue.yml has already run for it.
          if [ -n "$PR" ] && [ "$(gh pr view "$PR" --json state --jq .state)" != "OPEN" ]; then exit 0; fi
          gh label create ci-failure --force --color B60205 --description "The checks of a pull request or of main are red"
          if [ -z "$PR" ]; then
            gh issue create --title "$title" --label ci-failure --body "The checks on main failed on ${SHA:0:7}: $RUN

          The next green run on main closes this issue."
            exit 0
          fi
          url="$(gh issue create --title "$title" --label ci-failure --body "The checks of #$PR failed on ${SHA:0:7}: $RUN

          #$PR cannot merge until its checks are green. The next green run closes this issue.")"
          gh pr comment "$PR" --body "Blocked by #${url##*/}: the checks are red. $RUN"
