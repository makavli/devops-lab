# echo: the demo workload. agnhost (Kubernetes' own e2e test image) in serve-hostname mode answers every path,
# /hostname included, with the pod name, which makes load balancing visible, and does nothing else (never use its
# netexec mode behind a route: /shell runs any command). Delivered by Argo CD once GitOps is on (gitops/root.yaml).
# Try: for i in $(seq 30); do curl -s echo.localtest.me/hostname; echo; done | sort | uniq -c
apiVersion: apps/v1
kind: Deployment
metadata: { name: echo, namespace: default }
spec:
  replicas: 5
  selector: { matchLabels: { app: echo } }
  template:
    metadata: { labels: { app: echo } }
    spec:
      automountServiceAccountToken: false   # it never calls the API
      securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor             # without it the tainted control plane counts as a 0-pod domain: rollout deadlock
          matchLabelKeys: [pod-template-hash] # spread this ReplicaSet only, ignore the old one mid-rollout
          labelSelector: { matchLabels: { app: echo } }
      containers:
        - name: echo
          image: registry.k8s.io/e2e-test-images/agnhost:2.53@sha256:99c6b4bb4a1e1df3f0b3752168c89358794d02258ebebc26bf21c29399011a85
          args: ["serve-hostname", "--port=8080"]
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: http } }   # every path answers 200
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: echo, namespace: default }
spec:
  selector: { app: echo }
  ports: [{ name: http, port: 80, targetPort: http }]
---
# Envoy reads the Service's EndpointSlices and balances per request (L7), bypassing kube-proxy.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: { name: echo, namespace: default }
spec:
  parentRefs: [{ name: lab, namespace: default }]
  hostnames: ["echo.localtest.me"]
  rules:
    - backendRefs: [{ name: echo, port: 80 }]
